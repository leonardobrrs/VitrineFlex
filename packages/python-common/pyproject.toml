[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-common"
version = "1.0.0"
description = "Shared library for VitrineFlex microservices"
readme = "README.md"
authors = [{ name = "VitrineFlex Architecture Team" }]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.100.0"
]
